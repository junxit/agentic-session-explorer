[project]
name = "sx"
version = "0.5.0"
description = "Explore, archive, move, and safely delete the chat sessions AI coding agents (Claude Code, Codex, Gemini, and more) leave on your machine — all from one terminal TUI."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "junxit" }]
keywords = ["tui", "claude-code", "codex", "gemini", "sessions", "terminal"]

dependencies = [
    "textual>=0.79",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/junxit/agentic-session-explorer"
Repository = "https://github.com/junxit/agentic-session-explorer"
Issues = "https://github.com/junxit/agentic-session-explorer/issues"
Changelog = "https://github.com/junxit/agentic-session-explorer/blob/main/changelog.txt"

[project.scripts]
sx = "sx.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
